# Local EMQX scaffold. Production should use EMQX Cloud credentials/ACLs from a
# secret manager, TLS CA verification and one identity per device.
listeners.tcp.default.bind = "0.0.0.0:1883"
dashboard.listeners.http.bind = "0.0.0.0:18083"
mqtt.max_packet_size = "1MB"
zone.external.max_inflight = 32
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
  }
]
